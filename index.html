<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meri Billing App</title>

  <!-- HTML to Canvas Converter -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f5f7;
      color: #333;
      padding-bottom: 70px;
    }

    .app-header {
      position: sticky;
      top: 0;
      background-color: #075E54;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .content-section {
      display: none;
      padding: 15px;
    }

    .content-section.active {
      display: block;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat-card {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-card h4 {
      font-size: 11px;
      color: #2e7d32;
      margin-bottom: 5px;
    }

    .stat-card p {
      font-size: 18px;
      font-weight: bold;
      color: #075E54;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-green {
      background-color: #075E54;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-contact {
      background-color: #128C7E;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      width: 100%;
    }

    .btn-whatsapp-img {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }

    /* Bill Receipt Design */
    #receipt-card {
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-top: 15px;
    }

    .receipt-header {
      text-align: center;
      border-bottom: 2px dashed #bbb;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .receipt-header h2 {
      font-size: 18px;
      color: #075E54;
      margin-bottom: 4px;
    }

    .receipt-header p {
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }

    .bill-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .bill-table th, .bill-table td {
      border-bottom: 1px solid #eee;
      padding: 8px 4px;
      text-align: left;
      font-size: 13px;
    }

    .bill-table th {
      background-color: #f9f9f9;
    }

    .total-amount {
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #075E54;
      text-align: right;
    }

    .qr-container {
      text-align: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 2px dashed #bbb;
    }

    .qr-container img {
      width: 120px;
      height: 120px;
      margin-top: 5px;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #ffffff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #e0e0e0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
      width: 33%;
      height: 100%;
      cursor: pointer;
    }

    .nav-item.active {
      color: #075E54;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-header" id="header-title">Dashboard</div>

  <!-- 1. HOME TAB -->
  <div id="home-tab" class="content-section active">
    <div class="dashboard-grid">
      <div class="stat-card">
        <h4>TODAY SALES</h4>
        <p id="dash-today-sales">₹0</p>
      </div>
      <div class="stat-card">
        <h4>TOTAL BILLS</h4>
        <p id="dash-today-bills">0</p>
      </div>
    </div>

    <div class="card">
      <button class="btn-green" onclick="switchTab('bill-tab', 'Billing', 'nav-bill')">➕ Naya Bill Banayein</button>
    </div>

    <div class="card">
      <h3>Recent Bills</h3>
      <ul id="recent-bills-list" style="list-style: none; font-size:13px; margin-top:10px; line-height:1.8;">
        <li style="color:#888;">Koi bill nahi bana hai.</li>
      </ul>
    </div>
  </div>

  <!-- 2. BILL TAB -->
  <div id="bill-tab" class="content-section">
    <div class="card">
      <h3>Customer & Item Details</h3>
      
      <button type="button" class="btn-contact" onclick="pickContact()">📇 Phone Contacts Se Select Karein</button>

      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" id="cust-name" placeholder="Name">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="cust-phone" placeholder="Mobile Number">
      </div>
      <hr style="margin: 10px 0; border:0; border-top:1px solid #eee;">
      <div class="form-group">
        <label>Item Name</label>
        <input type="text" id="item-name" placeholder="Item name">
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Qty</label>
          <input type="number" id="item-qty" value="1">
        </div>
        <div class="form-group" style="flex:1;">
          <label>Price (₹)</label>
          <input type="number" id="item-price" placeholder="₹">
        </div>
      </div>
      <button class="btn-green" onclick="addItemToBill()">Add To Bill</button>
    </div>

    <!-- Live Bill Card -->
    <div id="receipt-container" style="display:none;">
      <div id="receipt-card">
        <div class="receipt-header">
          <h2 id="receipt-shop-name">Meri Shop</h2>
          <p><strong>Owner:</strong> <span id="receipt-owner">Rajesh Sharma</span></p>
          <p><strong>Ph:</strong> <span id="receipt-phone">9876543210</span></p>
          <p id="receipt-address">Main Market</p>
          <p style="margin-top:5px; font-weight:bold;" id="receipt-cust"></p>
        </div>

        <table class="bill-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="bill-items-list"></tbody>
        </table>

        <div class="total-amount" id="bill-total">Total: ₹0</div>

        <!-- Payment QR Section -->
        <div class="qr-container" id="qr-block" style="display:none;">
          <p style="font-size:12px; font-weight:bold; color:#075E54;">Scan & Pay via UPI</p>
          <img id="qr-image" src="" alt="Payment QR Code">
          <p style="font-size:11px; color:#777; margin-top:2px;" id="qr-upi-text"></p>
        </div>
      </div>

      <button class="btn-whatsapp-img" onclick="shareBillImage()">🖼️ WhatsApp Par Bill Image Bhejein</button>
    </div>
  </div>

  <!-- 3. SHOP SETTINGS TAB -->
  <div id="shop-settings-tab" class="content-section">
    <div class="card">
      <h3>Shop Details</h3>
      <div class="form-group" style="margin-top:10px;">
        <label>Dukan Ka Naam</label>
        <input type="text" id="setup-shop-name" placeholder="Shop Name">
      </div>
      <div class="form-group">
        <label>Shop Owner Name</label>
        <input type="text" id="setup-owner-name" placeholder="Owner / Proprietor Name">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="setup-phone" placeholder="Phone">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea id="setup-address" rows="2" placeholder="Address"></textarea>
      </div>
      <div class="form-group">
        <label>UPI ID (Payment QR Code Ke Liye)</label>
        <input type="text" id="setup-upi" placeholder="E.g. name@upi">
      </div>
      <button class="btn-green" onclick="saveShopDetails()">Save Details</button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home-tab', 'Dashboard', 'nav-home')">🏠 Home</div>
    <div class="nav-item" id="nav-bill" onclick="switchTab('bill-tab', 'Billing', 'nav-bill')">🧾 Bill</div>
    <div class="nav-item" id="nav-shop" onclick="switchTab('shop-settings-tab', 'Shop Settings', 'nav-shop')">⚙️ Shop</div>
  </nav>

  <script>
    let grandTotal = 0;
    let totalSalesCount = 0;
    let totalSalesAmount = 0;

    let shopData = {
      name: "Meri Shop",
      owner: "Owner Name",
      phone: "9876543210",
      address: "Main Market",
      upi: ""
    };

    function switchTab(tabId, title, navId) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      document.getElementById(navId).classList.add('active');
      document.getElementById('header-title').innerText = title;
    }

    function saveShopDetails() {
      shopData.name = document.getElementById('setup-shop-name').value || shopData.name;
      shopData.owner = document.getElementById('setup-owner-name').value || shopData.owner;
      shopData.phone = document.getElementById('setup-phone').value || shopData.phone;
      shopData.address = document.getElementById('setup-address').value || shopData.address;
      shopData.upi = document.getElementById('setup-upi').value || shopData.upi;

      alert('Shop details save ho gayi!');
    }

    async function pickContact() {
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const props = ['name', 'tel'];
          const contacts = await navigator.contacts.select(props, { multiple: false });
          if (contacts.length > 0) {
            const selected = contacts[0];
            if (selected.name && selected.name[0]) {
              document.getElementById('cust-name').value = selected.name[0];
            }
            if (selected.tel && selected.tel[0]) {
              let rawNum = selected.tel[0].replace(/\D/g, '');
              if (rawNum.length > 10) rawNum = rawNum.slice(-10);
              document.getElementById('cust-phone').value = rawNum;
            }
          }
        } catch (ex) {
          console.log("Contact pick cancelled");
        }
      } else {
        alert("Aapka browser Contacts feature support nahi karta. Manually name/number enter karein.");
      }
    }

    function addItemToBill() {
      const custName = document.getElementById('cust-name').value || "Grahak";
      const custPhone = document.getElementById('cust-phone').value;
      const itemName = document.getElementById('item-name').value;
      const qty = parseInt(document.getElementById('item-qty').value) || 1;
      const price = parseFloat(document.getElementById('item-price').value) || 0;

      if (!itemName || price <= 0) {
        alert('Sahi Item Name aur Price bharein!');
        return;
      }

      const total = qty * price;
      grandTotal += total;

      document.getElementById('receipt-shop-name').innerText = shopData.name;
      document.getElementById('receipt-owner').innerText = shopData.owner;
      document.getElementById('receipt-phone').innerText = shopData.phone;
      document.getElementById('receipt-address').innerText = shopData.address;
      document.getElementById('receipt-cust').innerText = "Customer: " + custName + (custPhone ? " (" + custPhone + ")" : "");

      const tbody = document.getElementById('bill-items-list');
      tbody.innerHTML += `<tr>
        <td>${itemName}</td>
        <td>${qty}</td>
        <td>₹${price}</td>
        <td>₹${total}</td>
      </tr>`;

      document.getElementById('bill-total').innerText = 'Total: ₹' + grandTotal;

      // QR Code Setup
      if (shopData.upi !== "") {
        const upiUrl = `upi://pay?pa=${encodeURIComponent(shopData.upi)}&pn=${encodeURIComponent(shopData.name)}&am=${grandTotal}&cu=INR`;
        const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiUrl)}`;
        
        document.getElementById('qr-image').src = qrApi;
        document.getElementById('qr-upi-text').innerText = "UPI ID: " + shopData.upi;
        document.getElementById('qr-block').style.display = 'block';
      }

      document.getElementById('receipt-container').style.display = 'block';

      // Update Dashboard
      totalSalesAmount += total;
      totalSalesCount += 1;
      document.getElementById('dash-today-sales').innerText = '₹' + totalSalesAmount;
      document.getElementById('dash-today-bills').innerText = totalSalesCount;

      const list = document.getElementById('recent-bills-list');
      if(totalSalesCount === 1) list.innerHTML = "";
      list.innerHTML = `<li>🧾 <strong>${custName}</strong> - ₹${grandTotal}</li>` + list.innerHTML;

      document.getElementById('item-name').value = '';
      document.getElementById('item-price').value = '';
      document.getElementById('item-qty').value = '1';
    }

    async function shareBillImage() {
      const receiptCard = document.getElementById('receipt-card');
      try {
        const canvas = await html2canvas(receiptCard, { scale: 2 });
        canvas.toBlob(async (blob) => {
          if (!blob) return;
          const file = new File([blob], 'Bill-Receipt.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Bill Receipt',
              text: 'Aapka Bill'
            });
          } else {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'Bill-Receipt.png';
            link.click();
            alert('Bill Image download ho gayi hai.');
          }
        }, 'image/png');
      } catch (err) {
        alert('Image banane me dikkat aayi.');
      }
    }
  </script>
</body>
</html>
